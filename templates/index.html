<!DOCTYPE html>
<html lang="tr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuBeat - {{ current_venue.name if current_venue else 'Müzik Deneyimi' }}</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    {% if current_venue %}
    <meta name="venue-id" content="{{ current_venue.id }}">
    {% endif %}

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Modern CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}">
</head>

<body>
    <div class="theme-toggle" style="position: fixed; top: 20px; right: 20px; z-index: 100;"></div>

    <main style="max-width: 600px; margin: 0 auto; padding: 20px; padding-bottom: 100px;">
        <!-- Header -->
        <header class="text-center mb-lg fade-in">
            <div class="flex items-center justify-center gap-md mb-sm">
                <img src="{{ url_for('static', filename='logo.svg') }}" alt="QuBeat" style="width: 40px; height: 40px;">
                <h1 style="font-family: var(--font-display); font-size: 2rem;">QuBeat</h1>
            </div>
            {% if current_venue %}
            <p class="text-secondary glass" style="display: inline-block; padding: 4px 12px; border-radius: 20px;">
                <i class="fas fa-location-dot"></i> {{ current_venue.name }}
            </p>
            {% endif %}
        </header>

        <!-- Current Track -->
        <section class="mb-xl animate-fade-in">
            <div class="now-playing" id="now-playing-card">
                <div class="content">
                    <img src="https://placehold.co/160x160/181818/a3a3a3?text=♪" class="cover" id="np-cover">
                    <div style="flex: 1; min-width: 0;">
                        <div class="text-muted text-sm mb-sm" style="letter-spacing: 1px;">ŞU AN ÇALIYOR</div>
                        <h2 class="title" id="np-title"
                            style="font-size: 1.5rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                            Müzik Durduruldu</h2>
                        <p class="artist" id="np-artist" style="color: rgba(255,255,255,0.7);">Sıradaki şarkı
                            bekleniyor...</p>
                    </div>
                    <div class="playing-indicator" id="playing-indicator" style="display: none;">
                        <span></span><span></span><span></span><span></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Search -->
        <section class="mb-xl animate-fade-in" style="animation-delay: 0.1s;">
            <div class="glass-card">
                <h3 class="mb-md">Şarkı İste</h3>
                <div class="search-container mb-md">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" class="input" id="search-input" placeholder="Şarkı veya sanatçı ara...">
                </div>
                <div id="search-results" class="flex flex-col gap-sm"></div>
            </div>
        </section>

        <!-- Queue -->
        <section class="animate-fade-in" style="animation-delay: 0.2s;">
            <div class="flex justify-between items-center mb-md">
                <h3>Sıradakiler</h3>
                <span class="text-muted text-sm" id="queue-count">0 şarkı</span>
            </div>

            <div class="queue-list stagger-animation" id="queue-list">
                <!-- Queue items will be populated by JS -->
                <div class="text-center text-muted p-lg">Kuyruk boş. İlk şarkıyı sen iste!</div>
            </div>
        </section>
    </main>

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/modern.js') }}"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const queueList = document.getElementById('queue-list');
            const queueCount = document.getElementById('queue-count');
            const npTitle = document.getElementById('np-title');
            const npArtist = document.getElementById('np-artist');
            const npCover = document.getElementById('np-cover');
            const playingIndicator = document.getElementById('playing-indicator');

            // Listen for queue updates
            document.addEventListener('queueUpdated', (e) => {
                const queue = e.detail;
                updateQueueUI(queue);
            });

            // Listen for now playing updates
            document.addEventListener('nowPlaying', (e) => {
                const track = e.detail;
                updateNowPlayingUI(track);
            });

            function updateQueueUI(queue) {
                queueCount.textContent = `${queue.length} şarkı`;

                if (queue.length === 0) {
                    queueList.innerHTML = '<div class="text-center text-muted p-lg">Kuyruk boş. İlk şarkıyı sen iste!</div>';
                    return;
                }

                queueList.innerHTML = queue.map((song, index) => `
                    <div class="queue-item">
                        <div class="position">${index + 1}</div>
                        <img src="${song.image_url || 'https://placehold.co/40x40'}" style="width: 40px; height: 40px; border-radius: 4px; object-fit: cover;">
                        <div style="flex: 1; min-width: 0;">
                            <div class="title" style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${song.name}</div>
                            <div class="artist" style="font-size: 0.875rem; color: var(--text-muted);">${song.artist}</div>
                        </div>
                        <div class="text-muted text-sm" style="display: flex; align-items: center; gap: 4px;">
                            <img src="${song.user_avatar || 'https://ui-avatars.com/api/?name=User&background=random'}" style="width: 20px; height: 20px; border-radius: 50%;">
                        </div>
                    </div>
                `).join('');
            }

            function updateNowPlayingUI(track) {
                if (!track || !track.item) {
                    npTitle.textContent = "Müzik Durduruldu";
                    npArtist.textContent = "Sıradaki şarkı bekleniyor...";
                    playingIndicator.style.display = 'none';
                    return;
                }

                const item = track.item;
                npTitle.textContent = item.name;
                npArtist.textContent = item.artists.map(a => a.name).join(', ');
                if (item.album.images.length > 0) {
                    npCover.src = item.album.images[0].url;
                    // Update background
                    document.body.style.setProperty('--bg-image', `url(${item.album.images[0].url})`);
                }

                if (track.is_playing) {
                    playingIndicator.style.display = 'flex';
                } else {
                    playingIndicator.style.display = 'none';
                }
            }

            // Initial data fetch
            fetch('/queue')
                .then(res => res.text())
                .then(html => {
                    // Parse and update if needed, but WebSocket will take over
                    // Just requesting to trigger backend update if needed
                });
        });
    </script>
</body>

</html>
